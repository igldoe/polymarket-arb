database: data/arb.sqlite

scan:
  interval_seconds: 120           # пауза между циклами сканирования
  markets_refresh_seconds: 1800   # как часто перезагружать списки рынков
  max_days_to_close: 120          # рынки дальше этого горизонта не загружаем и не сравниваем
  min_hours_to_close: 1           # отсекаем рынки, которые вот-вот закроются (5-минутные крипто-раунды)

venues:
  polymarket:
    enabled: true
    gamma_url: https://gamma-api.polymarket.com
    clob_url: https://clob.polymarket.com
    rate_per_sec: 25              # лимит Gamma /markets 300/10s, CLOB /book 1500/10s — берём с запасом
  kalshi:
    enabled: true
    base_url: https://api.elections.kalshi.com/trade-api/v2
    rate_per_sec: 8               # Basic: ~20 запросов/с
  limitless:
    enabled: true
    base_url: https://api.limitless.exchange
    rate_per_sec: 1               # официальных лимитов нет, держимся консервативно

matching:
  close_tolerance_days: 7         # макс. разница дат закрытия рынков в паре
  min_fuzzy_score: 70             # порог rapidfuzz token_set_ratio (0..100)
  top_k: 3                        # сколько лучших кандидатов брать на один рынок
  llm_min_gross_edge: 0.0         # в LLM идут только пары, где по ценам листинга YES+NO < 1 - это значение
  max_llm_checks_per_cycle: 100   # лимит проверок Claude за цикл (контроль расходов)
  llm_concurrency: 4
  min_confidence: 0.9             # уведомлять только при confidence >= порога
